name: MMD31 authentic French National club flags
on:
  push:
    branches:
      - mmd31-national1-national2-2627-test-20261022
    paths:
      - 'docs/club-flags/national-2627/roster.txt'
      - 'docs/club-flags/national-2627/build.py'
      - '.github/workflows/mmd31-national-2627-flags.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install graphics libraries
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4 cairosvg
      - name: Generate PNGs and audit all sources
        run: python docs/club-flags/national-2627/build.py
      - name: Commit only assets found from real crests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/club-flags/national-2627
          if ! git diff --cached --quiet; then
            git commit -m "Publish sourced National 1 and 2 club flag assets with audit"
            git pull --rebase origin mmd31-national1-national2-2627-test-20261022
            git push
          fi
