name: MMD31 Resolve overseas duplicate club crests
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths: ['scripts/outremer/resolve_duplicate_club_crests.py','.github/workflows/mmd31-resolve-duplicate-clubs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow beautifulsoup4 requests
      - run: python scripts/outremer/resolve_duplicate_club_crests.py
      - name: Commit corrected distinct club badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/outremer-2026-27/ audit/outremer-2026-27/duplicate_club_resolution.csv
          git commit -m "Resolve same-logo ambiguity while preserving distinct club identities" || exit 0
          git pull --rebase
          git push
