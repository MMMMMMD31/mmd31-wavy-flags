name: MMD31 French L2-L3 badges build
on:
  push:
    branches:
      - mmd31-french-l2l3-2627-20261021
    paths:
      - 'docs/club-flags/french-2627-l2l3/roster.json'
      - 'docs/club-flags/french-2627-l2l3/build.py'
      - '.github/workflows/mmd31-french-l2l3.yml'
jobs:
  flags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4 cairosvg
      - name: Render crested flags
        run: python docs/club-flags/french-2627-l2l3/build.py
      - name: Commit verified output and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/club-flags/french-2627-l2l3
          if ! git diff --cached --quiet; then
            git commit -m "Render authentic Ligue 2/3 club flags and Victory assets"
            git push
          fi
