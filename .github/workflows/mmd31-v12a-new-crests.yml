name: MMD31 V12A crests for five recovered French groups
on:
  push:
    branches: [mmd31-v12a-five-groups-20261023]
    paths:
      - tools/mmd31_build_v12a_missing_clubs_crests.py
      - .github/workflows/mmd31-v12a-new-crests.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Generate verified standard PNGs
        run: PYTHONPATH=tools python tools/mmd31_build_v12a_missing_clubs_crests.py
      - name: Publish verified badges on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/v12a-2026-27 docs/research/mmd31-v12a-five-groups
          if ! git diff --cached --quiet; then
            git commit -m "Source-verified V12A missing D3-D5 team badges [skip ci]"
            git push origin HEAD:mmd31-v12a-five-groups-20261023
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmd31-v12a-five-groups-crest-audit
          path: docs/research/mmd31-v12a-five-groups/
          if-no-files-found: warn
