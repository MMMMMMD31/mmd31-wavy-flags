name: MMD31 CGE33 D2 real crest publication
on:
  push:
    paths:
      - 'tools/mmd31_cge33_step2_d2_badges.py'
      - '.github/workflows/mmd31-cge33-step2-d2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pillow cairosvg requests beautifulsoup4
      - run: python tools/mmd31_cge33_step2_d2_badges.py
      - name: Commit and publish crest PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge33-adriatic-d2-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish sourced D2 crest PNGs and audit manifest"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
