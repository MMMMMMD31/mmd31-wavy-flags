name: MMD31 Belgian D3 last authenticated candidates
on:
  push:
    branches: [mmd31-belux-v13-d3-assets]
    paths: 
      - 'tools/belux_v13_fix_three_crests.py'
      - '.github/workflows/belux-v13-last-three.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - run: python tools/belux_v13_fix_three_crests.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/belgian-d3-clubs-2026-27/v13/
          if ! git diff --cached --quiet; then
            git commit -m "Complete available Belgian D3 crest source candidates"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
