name: MMD31 English V13 Wikipedia badges pilot
on:
  push:
    paths:
      - tools/english_v13_wiki_pilot.py
      - .github/workflows/english-v13-wiki-pilot.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python tools/english_v13_wiki_pilot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/english-v13/wikipedia_pilot.json
          git diff --cached --quiet || (git commit -m "Record Wikipedia football crest source pilot" && git push origin HEAD)
