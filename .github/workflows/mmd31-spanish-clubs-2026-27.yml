name: MMD31 Spanish 2026-27 crest assets
on:
  push:
    branches:
      - mmd31-spanish-clubs-2026-27-assets
    paths:
      - 'tools/spanish_clubs_2026_27_sources.txt'
      - 'tools/generate_spanish_clubs_2026_27.py'
      - '.github/workflows/mmd31-spanish-clubs-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Create 172 real-crest flat and wavy 120x96 PNG pairs
        run: python tools/generate_spanish_clubs_2026_27.py
      - name: Commit rendered crests to asset branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spanish-clubs-2026-27/v1/
          if git diff --cached --quiet; then
            echo "Crests already generated"
          else
            git commit -m "Publish 172 Spanish football team flags and victory flags"
            git pull --rebase origin mmd31-spanish-clubs-2026-27-assets
            git push origin HEAD:mmd31-spanish-clubs-2026-27-assets
          fi
