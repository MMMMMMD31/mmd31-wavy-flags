name: MMD31 East Europe D1 2026 crest pack
on:
  push:
    branches: [mmd31-east-europe-d1-2026-v13-badges]
    paths:
      - .github/workflows/mmd31-east-europe-2026-badges.yml
      - east-europe-d1-2026/generate.py
      - east-europe-d1-2026/clubs.csv
  workflow_dispatch:
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mmd31-east-europe-d1-2026-v13-badges
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow cairosvg
      - run: python east-europe-d1-2026/generate.py
      - name: Commit only genuinely sourced badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add east-europe-d1-2026/badges-manifest.json
          if [ -d docs/club-flags/east-europe-d1-2026 ]; then git add docs/club-flags/east-europe-d1-2026; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish Eastern European D1 authentic 120x96 crest candidates"
            git push
          fi
