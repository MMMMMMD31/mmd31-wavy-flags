name: CGE V11 Portable source
on:
  push:
    paths:
      - ".github/workflows/cge_v11_portable_source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/cge_v11_portable_source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v11-source-audit/uefa_hashed_*
          if ! git diff --cached --quiet; then git commit -m "CGE V11: export verified ranking digest"; git pull --rebase origin main; git push origin main; fi
