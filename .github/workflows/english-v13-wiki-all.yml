name: MMD31 authentic English Step 4 and 5 Wikipedia club crests
on:
  push:
    paths:
      - tools/english_v13_wiki_all.py
      - .github/workflows/english-v13-wiki-all.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python tools/english_v13_wiki_all.py
      - name: Verify PNG dimensions and publish on research branch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path("docs/english-clubs-2026-27/wiki-v13")
          r=json.loads((p/"manifest.json").read_text())
          imgs=list(p.glob("*.png"))
          assert len(imgs)==r["published"]
          for img in imgs:
            x=Image.open(img)
            assert x.size==(120,96) and x.format=="PNG",img
          print("VALIDATED",len(imgs),"real-sourced PNG assets")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/english-clubs-2026-27/wiki-v13/
          git diff --cached --quiet || (git commit -m "Generate Wikipedia-infobox sourced authentic English D8-D9 crests" && git push origin HEAD)
