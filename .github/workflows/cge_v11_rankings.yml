name: CGE V11 Rankings Evidence
on:
  push:
    paths:
      - ".github/workflows/cge_v11_rankings.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python scripts/cge_v11_export_rankings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v11-source-audit/
          if ! git diff --cached --quiet; then
            git commit -m "CGE V11: publish sourced rankings for calibration audit"
            git pull --rebase origin main
            git push origin main
          fi
