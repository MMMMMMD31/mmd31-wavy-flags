name: MMD31 V9 Charente D2A validated crests
on:
  push:
    branches: [mmd31-v9-charente-fix-20261023]
    paths:
      - tools/mmd31_fix_charente_d2a_crests.py
      - .github/workflows/mmd31-v9-charente-12-crests.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Generate 12 source-linked 120x96 PNGs
        run: PYTHONPATH=tools python tools/mmd31_fix_charente_d2a_crests.py
      - name: Commit and publish only on isolated test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/d1d2-2026-27 docs/research/mmd31-v9-charente-2026-27
          git commit -m "MMD31 Charente D2 group A verified club crests [skip ci]"
          git push origin HEAD:mmd31-v9-charente-fix-20261023
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmd31-v9-charente-d2a-crest-evidence
          path: docs/research/mmd31-v9-charente-2026-27/
          if-no-files-found: warn
