name: Verified Czech Slovak Hungarian D1 crests 2026-27

on:
  push:
    branches:
      - mmd31-central-europe-d1-20261024
    paths:
      - tools/mmd31_central_europe_logos.py
      - .github/workflows/mmd31-central-europe-badges.yml

permissions:
  contents: write

jobs:
  central-europe-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests beautifulsoup4
      - name: Fetch exact 2026-27 crest pages and 3 league operator logos
        run: python tools/mmd31_central_europe_logos.py
      - name: Publish and audit verified logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/central-europe-d1-2026-27/verified
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified badges for three European 2026-27 D1 leagues"
            git push origin HEAD:mmd31-central-europe-d1-20261024
          fi
