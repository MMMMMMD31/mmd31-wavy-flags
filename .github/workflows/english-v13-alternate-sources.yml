name: MMD31 EN crest database source verification
on:
  push:
    paths:
      - '.github/workflows/english-v13-alternate-sources.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/english_v13_alternate_sources.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/english-v13/alternate_image_sources.json
          git diff --cached --quiet || (git commit -m 'Document authentic club crest database source availability' && git push origin HEAD)
