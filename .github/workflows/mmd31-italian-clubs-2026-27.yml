name: MMD31 Italy club crest flags 2026-27
on:
  push:
    paths:
      - 'tools/generate_italian_clubs_2026_27.py'
      - '.github/workflows/mmd31-italian-clubs-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Render real Italian crest flags (120x96, solid club colors)
        run: python tools/generate_italian_clubs_2026_27.py
      - name: Commit generated club crest assets to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/italian-clubs-2026-27/v1/
          if git diff --cached --quiet; then
            echo "No new images"
          else
            git commit -m "Generate Italian club crest flag assets"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
