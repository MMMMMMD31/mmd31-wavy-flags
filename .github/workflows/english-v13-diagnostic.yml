name: MMD31 English V13 logo and ratings source audit
on:
  push:
    paths:
      - tools/english_v13_diagnostic.py
      - .github/workflows/english-v13-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/english_v13_diagnostic.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/english-v13/diagnostic.json
          git diff --cached --quiet || (git commit -m "Document English 2026-27 V13 source diagnostics" && git push origin HEAD)
