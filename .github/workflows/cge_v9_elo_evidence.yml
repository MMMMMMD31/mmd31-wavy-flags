name: CGE V9 - Official season 2026 standings evidence
on:
  push:
    paths:
      - ".github/workflows/cge_v9_elo_evidence.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet requests
      - run: python scripts/cge_v9_espn_standings.py
      - name: Save source evidence for user audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v9-espn-evidence
          if ! git diff --cached --quiet; then
            git commit -m "CGE V9: publish source-backed national standings evidence"
            git pull --rebase origin main
            git push origin main
          fi
