name: German V13 D6 NDR crest verification
on:
  push:
    branches:
      - mmd31-germany-d6-v13-logos-20261023
    paths:
      - 'tools/generate_german_v13_d6_ndr_crests.py'
      - 'tools/german_v13_d6_129_source_clubs.json'
      - '.github/workflows/mmd31-german-v13-d6-ndr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - run: python tools/generate_german_v13_d6_ndr_crests.py
      - name: Publish only matched genuine emblem thumbnails on branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/v13-d6/
          git diff --cached --quiet && exit 0
          git commit -m "Publish V13 sourced D6 crest candidates for identity review"
          git pull --rebase origin mmd31-germany-d6-v13-logos-20261023
          git push origin HEAD:mmd31-germany-d6-v13-logos-20261023
