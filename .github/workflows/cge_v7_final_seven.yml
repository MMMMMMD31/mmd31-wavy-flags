name: CGE V7 - Final seven authentic crests
on:
  push:
    paths:
      - ".github/workflows/cge_v7_final_seven.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow requests
      - name: Convert seven genuine crests from named source sites
        run: python scripts/cge_v7_last7_publish.py
      - name: Bulk commit authentic seven PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-authentic-badges-20261026
          if ! git diff --cached --quiet; then
            git commit -m "CGE V7: complete verified badges for Iceland and Kazakhstan"
            git pull --rebase origin main
            git push origin main
          fi
