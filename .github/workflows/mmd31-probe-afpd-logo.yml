name: MMD31 probe AFPD logo source
on:
  push:
    branches: [mmd31-ptgi-logos-20261023-test]
    paths:
      - '.github/workflows/mmd31-probe-afpd-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python tools/probe_afpd_competition_logo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portugal-gibraltar-clubs-2026-27/competition-logos/probe-afpd.json
          if ! git diff --cached --quiet; then
            git commit -m "Record AFPD logo provenance candidates"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
