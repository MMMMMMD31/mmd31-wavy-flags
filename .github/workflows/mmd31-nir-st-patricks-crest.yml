name: Complete St Patricks YM authentic crests
on:
  push:
    paths:
      - 'tools/nir_st_patricks_crest.py'
      - '.github/workflows/mmd31-nir-st-patricks-crest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests beautifulsoup4
      - run: python tools/nir_st_patricks_crest.py
      - name: Commit source-provenance and authentic 120x96 badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nir-clubs-2026-27/v13-extension/1900231300166.png docs/nir-clubs-2026-27/v13-extension/1900231300255.png docs/nir-clubs-2026-27/v13-extension/st_patricks_ym_badges_audit.json
          git commit -m "Complete real NAFL St Patricks YM and reserve crests"
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
