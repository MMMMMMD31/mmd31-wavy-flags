name: MMD31 Eredivisie and Andorra competition logos final
on:
  push:
    paths:
      - 'tools/mmd31_nl_ad_competition_logos_final.py'
      - '.github/workflows/mmd31-nl-ad-competition-logos-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Verify originals and standardize 1-to-1 PNG images
        run: python tools/mmd31_nl_ad_competition_logos_final.py
      - name: Publish only final images and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nl-andorra-competition-logos/v2/
          if ! git diff --cached --quiet; then
            git commit -m "Publish square current Eredivisie and FAF competition logos"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
