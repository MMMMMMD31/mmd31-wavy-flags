name: MMD31 Italy missing38 source research
on:
  push:
    paths:
      - 'tools/italian_missing38_probe.py'
      - 'tools/italian_missing38_validate.py'
      - '.github/workflows/mmd31-italian-missing38-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python tools/italian_missing38_probe.py
      - run: python tools/italian_missing38_validate.py
      - name: Commit research audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/italian-clubs-2026-27/research/
          if ! git diff --cached --quiet; then
            git commit -m "Research Italian Serie D missing badge sources"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
