name: MMD31 verify Ligue Corse R4 2026-2027 roster
on:
  push:
    branches: [mmd31-v12-french-system-final-audit-20261023]
    paths:
      - tools/mmd31_collect_corse_r4_source.py
      - .github/workflows/mmd31-corse-r4-source.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/mmd31_collect_corse_r4_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmd31-corse-r4-source-2026-27
          path: mmd31_corse_r4_roster_source_2026_27.json
          if-no-files-found: warn
