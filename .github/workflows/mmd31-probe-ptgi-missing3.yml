name: MMD31 identify last 3 Azores crest sources
on:
  push:
    branches: [mmd31-ptgi-logos-20261023-test]
    paths:
      - '.github/workflows/mmd31-probe-ptgi-missing3.yml'
      - 'tools/probe_ptgi_missing3.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python tools/probe_ptgi_missing3.py
      - name: Record source inspection results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portugal-gibraltar-clubs-2026-27/v1/probe-alternative-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Record researched Azores logo sources"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
