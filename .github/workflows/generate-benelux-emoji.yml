name: Generate Benelux Victory emoji flags
on:
  push:
    paths:
      - '.github/workflows/generate-benelux-emoji.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Generate ten authentic source-based flags (120x96)
        run: python generate_benelux_emoji_flags.py
      - name: Commit the ten flag PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/emoji-flags/179270000100*.png docs/emoji-flags/1792700001010.png docs/benelux-emoji-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Add ten authentic Benelux 120x96 waving victory flags"
            git push
          fi
