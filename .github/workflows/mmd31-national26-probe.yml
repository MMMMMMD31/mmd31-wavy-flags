name: MMD31 inspect club badge sources
on:
  push:
    branches:
      - mmd31-national2627-complete-46-20261022
    paths:
      - '.github/workflows/mmd31-national26-probe.yml'
      - 'docs/club-flags/national-2627/logo-probe.py'
jobs:
  investigate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python docs/club-flags/national-2627/logo-probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/club-flags/national-2627/logo-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified candidate logo metadata"
            git push
          fi
