name: Official Sportnet Slovak D2 badges
on:
  push:
    branches: [mmd31-central-europe-d2-20261025]
    paths: ['.github/workflows/mmd31-central-europe-d2-sportnet.yml']
permissions:
  contents: write
jobs:
  official_club_crests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mmd31-central-europe-d2-20261025
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python tools/mmd31_central_europe_d2_sportnet.py
      - name: Publish verified official club crest images
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/central-europe-d2-2026-27
          if ! git diff --cached --quiet; then
            git commit -m "Five Slovak D2 official Sportnet crest references and audit"
            git pull --rebase origin mmd31-central-europe-d2-20261025
            git push origin HEAD:mmd31-central-europe-d2-20261025
          fi
