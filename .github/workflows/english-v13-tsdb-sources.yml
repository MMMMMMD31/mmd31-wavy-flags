name: MMD31 EN authenticate remaining club crests via sports database
on:
  push:
    paths:
      - .github/workflows/english-v13-tsdb-sources.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests pillow
      - run: python tools/english_v13_tsdb_research.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/english-v13/tsdb_missing_55_research.json
          git diff --cached --quiet || (git commit -m 'Record verified sports-database club badge image candidates' && git push origin HEAD)
