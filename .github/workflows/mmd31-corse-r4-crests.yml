name: MMD31 generate standard Corse R4 2026-27 club crests
on:
  push:
    branches: [mmd31-v12-french-system-final-audit-20261023]
    paths:
      - tools/mmd31_build_corse_r4_crests.py
      - .github/workflows/mmd31-corse-r4-crests.yml
permissions:
  contents: write
  actions: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - run: |
          mkdir -p research-input
          gh run download 39934190087 -R "${GITHUB_REPOSITORY}" -n mmd31-corse-r4-source-2026-27 -D research-input
          test -s research-input/mmd31_corse_r4_roster_source_2026_27.json
      - run: PYTHONPATH=tools python tools/mmd31_build_corse_r4_crests.py
      - name: Publish PNG images only to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/r4-corse-2026-27 docs/research/mmd31-corse-r4-2026-27
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-verified Corse R4 2026-27 standard crests [skip ci]"
            git push origin HEAD:mmd31-v12-french-system-final-audit-20261023
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmd31-corse-r4-verified-crest-audit
          path: docs/research/mmd31-corse-r4-2026-27/
          if-no-files-found: warn
