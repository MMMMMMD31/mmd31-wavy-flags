name: MMD31 EN missing crest second pass isolated
on:
  push:
    paths:
      - '.github/workflows/english-v13-wiki-second-pass.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests beautifulsoup4 pillow cairosvg
      - run: python tools/english_v13_second_pass.py
      - name: Verify and publish additional real crest PNGs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('docs/english-clubs-2026-27/wiki-v13')
          m=json.loads((p/'manifest.json').read_text())
          files=list(p.glob('*.png'))
          assert len(files)==m['published']
          assert all(Image.open(f).size==(120,96) for f in files)
          print('verified',len(files),'club crest PNG files')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/english-clubs-2026-27/wiki-v13/
          git diff --cached --quiet || (git commit -m 'Expand verified English Step 4 and 5 crests from Wikipedia' && git push origin HEAD)

