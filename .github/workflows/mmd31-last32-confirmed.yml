name: CGE France - Recover 3 authentic overseas club crests
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/collect_last32_confirmed.py'
      - '.github/workflows/mmd31-last32-confirmed.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests pillow
      - name: Generate identity-specific 120x96 crest PNGs
        run: python scripts/outremer/collect_last32_confirmed.py
      - name: Commit approved images and source audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/outremer-2026-27/ audit/outremer-2026-27/lot8_three_public_badges.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish three verified overseas football club crests"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
