name: CGE V7 Debug SportsDB HTML
on:
  push:
    paths:
      - ".github/workflows/cge_v7_debug_html.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/cge_v7_debug_html.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-authentic-badges-20261026/debug_html.txt
          if ! git diff --cached --quiet; then git commit -m "CGE V7: inspect SportsDB image layout"; git push; fi
