name: MMD31 D2 2026-27 source survey
on:
  push:
    branches: [mmd31-d1d2-20261023]
    paths:
      - 'tools/mmd31_collect_d2_2026_27.py'
      - '.github/workflows/mmd31-d2-2026-27.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/mmd31_collect_d2_2026_27.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmd31-d2-2026-27-sourced-rosters
          path: district-research/
          if-no-files-found: warn
