name: MMD31 Saint Martin verified club crests
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths: ['scripts/outremer/collect_saintmartin.py','.github/workflows/mmd31-saintmartin-crests.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4 pillow imagehash numpy
      - run: python scripts/outremer/collect_saintmartin.py
      - name: Commit authentic Saint-Martin badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/outremer-2026-27/ audit/outremer-2026-27/saintmartin_crest_audit.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish checked Saint Martin club badges"
            git pull --rebase
            git push
          fi
