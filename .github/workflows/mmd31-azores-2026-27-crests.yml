name: MMD31 publish Azores 2026-27 club crests
on:
  push:
    branches: [mmd31-ptgi-logos-20261023-test]
    paths:
      - 'tools/azores_2026_27_new_badges.json'
      - 'tools/generate_azores_2026_27_new_badges.py'
      - '.github/workflows/mmd31-azores-2026-27-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - name: Generate real badge PNG 120x96 for each matched club
        run: python tools/generate_azores_2026_27_new_badges.py
      - name: Commit artwork to isolated test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portugal-gibraltar-clubs-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish new Azores club crests with source manifest"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
