name: Publish authentic Premier League competition crest
on:
  push:
    paths:
      - tools/mmd31_publish_premier_league_logo.py
      - .github/workflows/mmd31-premier-league-logo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests pillow
      - run: python tools/mmd31_publish_premier_league_logo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/english-clubs-2026-27/competition/premier-league-logo.png docs/english-clubs-2026-27/competition/premier-league-logo-source.json
          git diff --cached --quiet || (git commit -m "Publish Premier League authentic lion logo for English pyramid" && git push origin HEAD)
