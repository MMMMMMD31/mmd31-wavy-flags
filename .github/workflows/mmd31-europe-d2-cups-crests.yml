name: Publish CGE38 2026-27 D2 and cup club badges
on:
  push:
    paths:
      - 'tools/mmd31_europe_d2_cups_crests.py'
      - '.github/workflows/mmd31-europe-d2-cups-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python tools/mmd31_europe_d2_cups_crests.py
      - name: Save manifest
        uses: actions/upload-artifact@v4
        with:
          name: mmd31-europe-d2-cup-crest-manifest
          path: docs/europe-d2-cups-2026-27/v1/manifest.json
      - name: Publish sourced badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/europe-d2-cups-2026-27/v1
          if ! git diff --cached --quiet; then
            git commit -m "Publish CGE38 2026-27 D2 and cup participant crests"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
