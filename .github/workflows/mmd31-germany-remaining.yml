name: Publish authenticated German club crests MMD31
on:
  push:
    branches: [mmd31-germany-remaining-crests-20261024]
    paths:
      - 'tools/mmd31_generate_germany_remaining.py'
      - 'tools/mmd31_commons_germany.py'
      - '.github/workflows/mmd31-germany-remaining.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests
      - name: Match and render verified club crests
        run: python tools/mmd31_generate_germany_remaining.py
      - name: Discover exact-name German club crests on Wikimedia Commons
        run: python tools/mmd31_commons_germany.py
      - name: Commit verified PNGs to isolated German branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/missing-20261024/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified German club crests"
            git pull --rebase origin mmd31-germany-remaining-crests-20261024
            git push origin HEAD:mmd31-germany-remaining-crests-20261024
          fi
