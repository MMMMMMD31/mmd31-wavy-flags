name: Audit Italian Serie D ratings 2026 10 23
on:
  push:
    paths:
      - 'tools/audit_italian_2026_standings.py'
      - '.github/workflows/mmd31-audit-italian-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/audit_italian_2026_standings.py
      - name: Commit audit snapshot on test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/italian-clubs-2026-27/research/rating-standings-2026-10-23.json
          git commit -m "Capture Serie D current standings for ratings validation"
          git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
