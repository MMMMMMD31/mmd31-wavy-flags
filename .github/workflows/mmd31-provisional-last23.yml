name: MMD31 France create 23 provisional overseas badges for 326 total
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/create_last23_provisional.py'
      - '.github/workflows/mmd31-provisional-last23.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Generate 23 clearly provisional non-authentic monogram PNG flags
        run: python scripts/outremer/create_last23_provisional.py
      - name: Commit 23 new PNGs and audited 326-team manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/outremer-2026-27/ audit/outremer-2026-27/lot13_remaining23_provisional_manifest.json audit/outremer-2026-27/published_overseas_manifest_326.csv
          if ! git diff --cached --quiet; then
            git commit -m "CGE3: add 23 provisional club badges and complete 326/326 PNG coverage"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
