name: Publish Northern Ireland federation logo
on:
  push:
    paths:
      - 'tools/nir_ifa_competition_logo.py'
      - '.github/workflows/mmd31-nir-ifa-competition-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - run: python tools/nir_ifa_competition_logo.py
      - name: Commit logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nir-clubs-2026-27/competition/
          if ! git diff --cached --quiet; then
            git commit -m "Publish identifiable Irish FA governing-body competition image"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
