name: MMD31 Collect D3 D4 D5 2026/27
on:
  push:
    branches: [mmd31-d3d4d5-20261023]
    paths:
      - 'tools/mmd31_collect_d3d4d5_2026_27.py'
      - '.github/workflows/mmd31-d3d4d5-survey.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        division: [3,4,5]
    env:
      MMD31_DIVISION: ${{ matrix.division }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Retrieve 2026/27 real district participants
        run: python tools/mmd31_collect_d3d4d5_2026_27.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmd31-source-d${{ matrix.division }}-2026-27
          path: district-research/
          if-no-files-found: warn
