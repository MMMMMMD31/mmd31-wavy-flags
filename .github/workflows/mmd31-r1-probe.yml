name: MMD31 regional football R1 roster research
on:
  push:
    branches: [mmd31-regional1-2627-research-20261022]
    paths:
      - "docs/r1-probe.py"
      - ".github/workflows/mmd31-r1-probe.yml"
jobs:
  roster:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python docs/r1-probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/r1-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 2026/27 regional league page samples"
            git pull --rebase
            git push
          fi
