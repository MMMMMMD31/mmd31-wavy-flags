name: Publish MMD31 remaining 38 Italian crest flags
on:
  push:
    paths:
      - 'tools/generate_italian_club_missing38.py'
      - '.github/workflows/mmd31-italian-club-missing38.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow
      - name: Generate and verify 38 club crest PNGs
        run: python tools/generate_italian_club_missing38.py
      - name: Commit new 120x96 Italian flags and audited source manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/italian-clubs-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 38 missing authentic Italian club flags"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
