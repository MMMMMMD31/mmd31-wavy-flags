name: MMD31 National League Federation Logos
on:
  push:
    paths:
      - 'tools/generate_nl_andorra_federation_logos.py'
      - '.github/workflows/mmd31-nl-ad-federation-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests
      - run: python tools/generate_nl_andorra_federation_logos.py
      - name: Publish official federation artwork only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nl-andorra-competition-logos/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish KNVB and FAF federation competition logos"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
