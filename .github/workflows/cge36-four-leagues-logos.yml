name: CGE 3.6 four leagues authentic crests and federation logos
on:
  push:
    paths:
      - 'tools/cge36_four_leagues_logos.py'
      - '.github/workflows/cge36-four-leagues-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - run: python tools/cge36_four_leagues_logos.py
      - name: Commit verified images and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge36-four-leagues-2026/
          if ! git diff --cached --quiet; then
            git commit -m "Publish official crests 48 clubs and four federations"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
