name: MMD31 Portugal Gibraltar club crest flags 2026-27
on:
  push:
    branches:
      - mmd31-ptgi-logos-20261023-test
    paths:
      - 'tools/portugal_gibraltar_2026_27_sources.csv'
      - 'tools/generate_portugal_gibraltar_2026_27.py'
      - '.github/workflows/mmd31-portugal-gibraltar-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Generate authentic 120x96 club crest image on matching solid club color
        run: python tools/generate_portugal_gibraltar_2026_27.py
      - name: Commit generated test assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portugal-gibraltar-clubs-2026-27/v1/
          if git diff --cached --quiet; then
            echo "No new crest assets"
          else
            git commit -m "Render Portuguese and Gibraltar club crests 120x96"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
