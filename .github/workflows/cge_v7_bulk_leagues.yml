name: CGE V7 - Bulk real crests from 2026-2027 club leagues
on:
  push:
    paths:
      - ".github/workflows/cge_v7_bulk_leagues.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow requests beautifulsoup4
      - name: Source and normalize authentic club badges in one batch
        run: python scripts/cge_v7_scrape_verified_leagues.py
      - name: Commit all verified authentic crests and auditable sources together
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-authentic-badges-20261026
          if ! git diff --cached --quiet; then
            git commit -m "CGE V7: bulk publish genuine club crests with source audit"
            git pull --rebase origin main
            git push origin main
          fi
