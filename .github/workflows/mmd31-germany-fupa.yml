name: Authenticated German amateur badges FuPa

on:
  push:
    branches:
      - mmd31-germany-fupa-last-231-20261024
    paths:
      - tools/mmd31_fupa_germany_badges.py
      - .github/workflows/mmd31-germany-fupa.yml
  workflow_dispatch:
    inputs:
      offset:
        description: "Index of first missing German club"
        required: true
        default: "534"
      limit:
        description: "Number of clubs to try"
        required: true
        default: "47"

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests beautifulsoup4
      - name: Fetch verified club crests
        env:
          OFFSET: ${{ inputs.offset || '534' }}
          LIMIT: ${{ inputs.limit || '47' }}
        run: python tools/mmd31_fupa_germany_badges.py --offset "$OFFSET" --limit "$LIMIT"
      - name: Save sourced images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/fupa-authenticated-20261024
          if ! git diff --cached --quiet; then
            git commit -m "Add exact-name verified German amateur FuPa crests"
            git push origin HEAD:mmd31-germany-fupa-last-231-20261024
          fi
