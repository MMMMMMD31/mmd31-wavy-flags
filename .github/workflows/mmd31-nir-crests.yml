name: Build Northern Irish Club Crests 2026-27
on:
  push:
    paths:
      - 'tools/generate_nir_2026_27_crests.py'
      - 'tools/nir_2026_27_sources.json'
      - '.github/workflows/mmd31-nir-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Fetch, render, and audit authentic 120x96 club crests
        run: python tools/generate_nir_2026_27_crests.py
      - name: Commit assets to test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nir-clubs-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Northern Irish club crest assets"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
