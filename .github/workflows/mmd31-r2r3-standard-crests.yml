name: MMD31 R2 R3 source-linked standard crests
on:
  push:
    branches:
      - mmd31-r2r3-standard-crests-20261022
    paths:
      - 'tools/mmd31_build_r2r3_standard_crests.py'
      - '.github/workflows/mmd31-r2r3-standard-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and web tools
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Fetch previously collected R2/R3 sources
        run: |
          mkdir -p research-input
          gh run download 39841471791 -R "${GITHUB_REPOSITORY}" -n mmd31-r2r3-research -D research-input
          test -s research-input/MMD31_RECHERCHE_R2_R3_2026_2027.json
      - name: Generate source-linked 120x96 club crests
        run: python tools/mmd31_build_r2r3_standard_crests.py
      - name: Publish PNGs and source-linked audit on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/r2r3-2026-27/ docs/research/mmd31-r2r3-2026-27/
          if ! git diff --cached --quiet; then
            git commit -m "Publish R2 R3 standard crests and FFF affiliation audit [skip ci]"
            git push origin HEAD:mmd31-r2r3-standard-crests-20261022
          fi
      - name: Upload provenance report and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmd31-r2r3-standard-crest-audit
          path: |
            docs/research/mmd31-r2r3-2026-27/crest_manifest.json
            docs/research/mmd31-r2r3-2026-27/unresolved.json
            docs/research/mmd31-r2r3-2026-27/contact_sheet.png
            docs/research/mmd31-r2r3-2026-27/README.md
          if-no-files-found: warn
