name: CGE V7 verified FootyLogos badges
on:
  push:
    paths:
      - 'tools/cge_v7_footylogos_badges.py'
      - '.github/workflows/cge-v7-footylogos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pillow cairosvg requests beautifulsoup4
      - name: Scrape only verified club pages, render and audit badges
        run: python -u tools/cge_v7_footylogos_badges.py
      - name: Publish badges and source-audit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-d3-2026-27/v3/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified club crests for CGE V7 Wales and Nordic leagues"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
