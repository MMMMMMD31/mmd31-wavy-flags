name: MMD31 CGE3 - Authentic CH AT SM 2026-27 team logos batch
on:
  push:
    branches: [mmd31-cge3-suisse-autriche-sanmarin-20261024]
    paths:
      - 'scripts/cge3/collect_ch_at_sm_2026_27.py'
      - '.github/workflows/cge3-ch-at-sm-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests beautifulsoup4
      - name: Generate authentic crest PNGs 120x96 and official managing league logos
        run: python scripts/cge3/collect_ch_at_sm_2026_27.py
      - name: Commit all generated assets and full source inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/cge3-europe-2026-27 flags/competition/cge3-europe-2026-27 audit/cge3-europe-2026-27
          if ! git diff --cached --quiet; then
            git commit -m "Add authentic 2026-27 Swiss Austrian San Marino league club crests"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
