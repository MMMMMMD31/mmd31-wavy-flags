name: Verify St Patricks YM club crest
on:
  push:
    paths:
      - 'tools/nir_ym_crest_probe.py'
      - '.github/workflows/mmd31-nir-ym-crest-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/nir_ym_crest_probe.py
      - name: Commit source audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nir-clubs-2026-27/v13-extension/ym-crest-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit sources for St Patricks YM badge"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
