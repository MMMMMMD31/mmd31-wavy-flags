name: CGE V7 - Strict TheSportsDB badge verification
on:
  push:
    paths:
      - ".github/workflows/cge_v7_sportsdb_badges.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow requests
      - name: Resolve exactly matched authentic badges
        run: python scripts/cge_v7_sportsdb_badges.py
      - name: Publish actual PNGs and source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-authentic-badges-20261026
          if ! git diff --cached --quiet; then
            git commit -m "CGE V7: publish exact source-matched club badges"
            git push
          fi
