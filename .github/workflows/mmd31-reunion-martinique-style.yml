name: MMD31 Overseas Club Color Backgrounds
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/restyle_reunion_martinique.py'
      - '.github/workflows/mmd31-reunion-martinique-style.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - run: python scripts/outremer/restyle_reunion_martinique.py
      - name: Commit verified club colors
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add flags/clubs/standard/outremer-2026-27/
          if ! git diff --cached --quiet; then
            git commit -m "Style overseas club crests with colors from authentic crest artwork"
            git push
          fi
