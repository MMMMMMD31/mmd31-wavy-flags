name: Probe Northern Irish badge directories
on:
  push:
    paths:
      - 'tools/nir_nafl_probe.py'
      - '.github/workflows/mmd31-nir-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/nir_nafl_probe.py
      - name: Publish source inspection data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nir-clubs-2026-27/v1/nafl_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Inspect authentic amateur league crest image sources"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
