name: German club crests Commons exact match
on:
  push:
    branches: [mmd31-germany-remaining-crests-20261024]
    paths:
      - '.github/workflows/mmd31-germany-commons-only.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-commons:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests
      - name: Find verified Wikimedia Commons badges by exact club name
        run: python tools/mmd31_commons_germany.py
      - name: Commit sourced badges and attribution information
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/missing-20261024/
          if ! git diff --cached --quiet; then
            git commit -m "Add exact-name Commons crests for German amateur clubs"
            git pull --rebase origin mmd31-germany-remaining-crests-20261024
            git push origin HEAD:mmd31-germany-remaining-crests-20261024
          fi
