name: MMD31 Netherlands and Andorra Club Crest Flags 2026-27
on:
  push:
    paths:
      - 'tools/generate_nl_andorra_2026_27.py'
      - '.github/workflows/mmd31-nl-andorra-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Render 120x96 authentic crest assets
        run: python tools/generate_nl_andorra_2026_27.py
      - name: Commit club flags on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nl-andorra-clubs-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Netherlands and Andorra club flags 2026-27"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
