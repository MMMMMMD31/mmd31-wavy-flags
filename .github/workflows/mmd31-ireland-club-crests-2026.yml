name: MMD31 Republic of Ireland authentic club crest flags (2026)
on:
  push:
    branches:
      - mmd31-ireland-2026-crest-test
    paths:
      - 'tools/generate_ireland_club_crests_2026.py'
      - '.github/workflows/mmd31-ireland-club-crests-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests pillow cairosvg beautifulsoup4
      - name: Render actual 120x96 club crests on club-color backgrounds
        run: python tools/generate_ireland_club_crests_2026.py
      - name: Commit png files and audit on separate test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/irish-clubs-2026/v1/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish authentic Irish club flags and provenance audit'
            git push origin HEAD:refs/heads/$GITHUB_REF_NAME
          fi
