name: CGE V8 Compact Contrast Findings
on:
  push:
    paths:
      - ".github/workflows/cge_v8_compact_contrast.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/cge_v8_compact_contrast_findings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v8-contrast-audit/flagged_contrast_unique.csv
          if ! git diff --cached --quiet; then git commit -m "CGE V8: compact potential low-contrast club badges"; git pull --rebase origin main; git push; fi
