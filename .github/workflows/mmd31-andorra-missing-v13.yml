name: MMD31 Andorra missing club crests V13
on:
  push:
    paths:
      - 'tools/mmd31_missing_andorra_crests_v13.py'
      - '.github/workflows/mmd31-andorra-missing-v13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow requests
      - run: python tools/mmd31_missing_andorra_crests_v13.py
      - name: Publish only two missing logos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nl-andorra-clubs-2026-27/v13/
          if ! git diff --cached --quiet; then
            git commit -m "Complete two missing Andorran club crest files V13"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
