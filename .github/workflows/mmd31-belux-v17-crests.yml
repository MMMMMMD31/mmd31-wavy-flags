name: MMD31 2026-27 Belgium D4 D5 authentic crest research
on:
  push:
    branches: [mmd31-belux-d4-d5-v17-crests-test]
    paths:
      - 'tools/mmd31-belux-v17-crests.py'
      - '.github/workflows/mmd31-belux-v17-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow cairosvg
      - run: python tools/mmd31-belux-v17-crests.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/belgian-d4-d5-2026-27/v17/
          if ! git diff --cached --quiet; then
            git commit -m "Publish source-linked Belgium D4/D5 crest candidates (no placeholders)"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
