name: MMD31 Belgium Luxembourg 2026-27 crests
on:
  push:
    branches:
      - mmd31-belux-crests-test-2026
    paths:
      - 'tools/generate_belux_clubs_2026_27.py'
      - '.github/workflows/mmd31-belux-clubs-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests beautifulsoup4
      - name: Generate real club-logo centered flags 120x96
        run: python tools/generate_belux_clubs_2026_27.py
      - name: Commit verified PNGs and manifest on isolated test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/belgium-luxembourg-clubs-2026-27/v1/
          if git diff --cached --quiet; then
            echo "No new images"
          else
            git commit -m "Publish verified Belgian and Luxembourg club crest flags"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
