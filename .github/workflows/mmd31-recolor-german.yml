name: Recolor published German crest backgrounds
on:
  push:
    branches: [mmd31-germany-remaining-crests-20261024]
    paths:
      - 'tools/mmd31_recolor_german_verified.py'
      - '.github/workflows/mmd31-recolor-german.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests
      - run: python tools/mmd31_recolor_german_verified.py
      - name: Publish club-colour backgrounds
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/missing-20261024/
          if ! git diff --cached --quiet; then
            git commit -m "Use genuine crest dominant colours as backgrounds"
            git pull --rebase origin mmd31-germany-remaining-crests-20261024
            git push origin HEAD:mmd31-germany-remaining-crests-20261024
          fi
