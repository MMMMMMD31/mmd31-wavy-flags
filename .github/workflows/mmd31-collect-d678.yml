name: MMD31 collect 2026-27 D6 D7 D8
on:
  push:
    branches: [mmd31-d6d7d8-20261023]
    paths:
      - tools/mmd31_collect_d6d7d8.py
      - .github/workflows/mmd31-collect-d678.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        division: [6,7,8]
    env:
      MMD31_DIVISION: ${{ matrix.division }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/mmd31_collect_d6d7d8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mmd31-d${{ matrix.division }}-2026-27-inventory
          path: district-research/
          if-no-files-found: warn
