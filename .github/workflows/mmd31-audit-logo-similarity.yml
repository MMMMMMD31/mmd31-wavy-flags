name: MMD31 - Detect placeholder club logos
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/audit_logo_similarity.py'
      - '.github/workflows/mmd31-audit-logo-similarity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow imagehash numpy
      - run: python scripts/outremer/audit_logo_similarity.py
      - name: Commit visual audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/outremer-2026-27/crest_similarity_audit.csv
          if ! git diff --cached --quiet; then
            git commit -m "Audit false FFF placeholder crests"
            git pull --rebase
            git push
          fi
