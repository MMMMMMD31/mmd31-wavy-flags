name: MMD31 EN 55 missing genuine crests V11
on:
  push:
    paths:
      - .github/workflows/english-v11-remaining-55.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests pillow
      - run: python tools/english_v11_remaining_badges.py
      - name: Validate PNG outputs and publish on dedicated branch
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          from pathlib import Path
          p=Path('docs/english-clubs-2026-27/remaining-55-v11')
          m=json.loads((p/'manifest.json').read_text())
          images=list(p.glob('*.png'))
          assert len(images)==m['published']
          for f in images:
            with Image.open(f) as im:
              assert im.size==(120,96) and im.format=='PNG'
          print('VERIFIED',len(images),'genuine images')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/english-clubs-2026-27/remaining-55-v11/
          git diff --cached --quiet || (git commit -m 'Publish newly identified genuine English Step 4 and 5 badge images' && git push origin HEAD)
