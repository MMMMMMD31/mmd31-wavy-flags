name: CGE V7 - Wikidata verified missing badges
on:
  push:
    paths:
      - ".github/workflows/cge_v7_wikidata_badges.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow requests
      - name: Find exact authentic club logos and prepare badge PNGs
        run: python scripts/cge_v7_wikidata_badges.py
      - name: Publish only sourced PNGs and evidence report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-authentic-badges-20261026
          if ! git diff --cached --quiet; then
            git commit -m "CGE V7: source-verified club badges from Wikidata Commons"
            git push
          fi
