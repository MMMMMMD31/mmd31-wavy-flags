name: MMD31 - Martinique last clubs
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/collect_martinique_ascef.py'
      - '.github/workflows/mmd31-martinique-last-clubs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python scripts/outremer/collect_martinique_ascef.py
      - name: Publish crest and document unresolved ones
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add flags/clubs/standard/outremer-2026-27/1990262000204.png audit/outremer-2026-27/martinique_last3_audit.csv
          git commit -m "Add authentic Martinique ASCEF crest; record unresolved EER and Golden Lion" || exit 0
          git pull --rebase
          git push
