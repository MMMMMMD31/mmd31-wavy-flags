name: Inspect Kosovo D2 crest archive
on:
  push:
    branches:
      - mmd31-balkans-d1-2026-test
    paths:
      - tools/mmd31_discover_kosovo_d2.py
      - .github/workflows/mmd31-discover-kosovo.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/mmd31_discover_kosovo_d2.py
      - name: Store audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/balkans-d2-2026/v1/kosovo_image_discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Kosovo D2 authentic club crest image candidates"
            git push origin HEAD:refs/heads/$GITHUB_REF_NAME
          fi
