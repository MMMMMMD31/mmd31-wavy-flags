name: MMD31 - Publish JS Marigot FC Ligne Paradis AS Montgaillard authentic crests
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/collect_lot11_3_crests.py'
      - '.github/workflows/mmd31-lot11.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow requests
      - run: python scripts/outremer/collect_lot11_3_crests.py
      - name: Save authenticated club-logo PNGs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/outremer-2026-27/ audit/outremer-2026-27/lot11_three_club_sources.json
          git commit -m "Publish authentic club-specific JS Marigot Ligne Paradis and Montgaillard crests"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
