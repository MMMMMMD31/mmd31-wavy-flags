name: MMD31 Adriatic D1 authentic club crests 2026-27
on:
  push:
    paths:
      - 'tools/mmd31_adriatic_d1_2026_27.py'
      - '.github/workflows/mmd31-adriatic-d1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crests:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image packages
        run: python -m pip install --disable-pip-version-check pillow cairosvg requests beautifulsoup4
      - name: Render authentic club crests
        run: python tools/mmd31_adriatic_d1_2026_27.py
      - name: Publish PNG and manifest to source branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/adriatic-d1-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish authentic Adriatic D1 crests and source manifest"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
