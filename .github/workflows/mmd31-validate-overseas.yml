name: MMD31 - Verify overseas crests and manifest
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/validate_published_overseas.py'
      - '.github/workflows/mmd31-validate-overseas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - run: python scripts/outremer/validate_published_overseas.py
      - name: Commit 326-club audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/outremer-2026-27/roster_326.csv audit/outremer-2026-27/published_overseas_manifest.csv audit/outremer-2026-27/published_overseas_validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit and index 326 overseas crests"
            git pull --rebase
            git push
          fi
