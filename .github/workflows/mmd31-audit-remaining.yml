name: MMD31 inspect remaining crest sources
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/discover_remaining_crests.py'
      - '.github/workflows/mmd31-audit-remaining.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/outremer/discover_remaining_crests.py
      - name: Commit candidate metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/outremer-2026-27/lot10_page_images_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit original image sources for remaining overseas football clubs"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
