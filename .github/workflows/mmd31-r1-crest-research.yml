name: Research and publish R1 standard club crests (test branch)
on:
  push:
    branches:
      - mmd31-r1-standard-crests-audit-20261022
    paths:
      - 'tools/mmd31_collect_r1_crest_sources.py'
      - '.github/workflows/mmd31-r1-crest-research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect linked sources and create standard 120x96 PNGs
        run: python tools/mmd31_collect_r1_crest_sources.py
      - name: Commit candidate crests and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/r1-2026-27 docs/research/mmd31-r1-2026-27/crest_manifest.json docs/research/mmd31-r1-2026-27/crest_audit.md
          if ! git diff --cached --quiet; then
            git commit -m "R1 2026-27 source-linked crest candidates and audit [skip ci]"
            git push
          fi
