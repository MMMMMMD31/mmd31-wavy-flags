name: MMD31 Authentic AOM Aigles d'Or Mana crest
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/collect_lot12_aom.py'
      - '.github/workflows/mmd31-lot12-aom.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow requests
      - run: python scripts/outremer/collect_lot12_aom.py
      - name: Commit exact Mana logo and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flags/clubs/standard/outremer-2026-27/1990262000093.png audit/outremer-2026-27/lot12_aom_mana.json
          git commit -m "Publish authentic Aigles d'Or Mana club logo for A.O.M."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
