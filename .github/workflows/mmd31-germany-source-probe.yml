name: German football badge source accessibility probe

on:
  push:
    branches:
      - mmd31-germany-remaining-crests-20261024
    paths:
      - tools/mmd31_probe_amateur_badge_sources.py
      - .github/workflows/mmd31-germany-source-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python tools/mmd31_probe_amateur_badge_sources.py
      - name: Save non-destructive findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/source-probe-20261024/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record authorized German amateur football crest source probe"
            git push origin HEAD:mmd31-germany-remaining-crests-20261024
          fi
