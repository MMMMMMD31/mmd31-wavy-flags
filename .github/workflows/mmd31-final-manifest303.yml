name: MMD31 Verify 303 of 326 overseas crests
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/refresh_manifest_303.py'
      - '.github/workflows/mmd31-final-manifest303.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow
      - run: python scripts/outremer/refresh_manifest_303.py
      - name: Commit current overseas manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/outremer-2026-27/published_overseas_manifest_303.csv audit/outremer-2026-27/published_overseas_status_303.json
          git commit -m "Verify 303 authentic overseas crests and list 23 unresolved clubs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
