name: CGE 3.2 missing D2 authentic crest lookup
on:
  push:
    branches: [mmd31-cge-greece-cyprus-malta-israel-20261024]
    paths:
      - 'tools/cge_stage2_find_missing_logos.py'
      - '.github/workflows/mmd31-cge-stage2-crest-find.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/cge_stage2_find_missing_logos.py
