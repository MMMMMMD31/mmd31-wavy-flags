name: Four leagues Malta crest diagnostic
on:
  push:
    branches: [mmd31-cge-greece-cyprus-malta-israel-20261024]
    paths:
      - 'tools/cge_four_fix_malta_logo_diagnostic.py'
      - '.github/workflows/mmd31-four-malta-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - run: python tools/cge_four_fix_malta_logo_diagnostic.py
