name: CGE V9 - Sourced Elo proposals for 719 first-division clubs
on:
  push:
    paths:
      - ".github/workflows/cge_v9_all_d1_espn.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - name: Calculate conservative country-matched provisional Elo proposals
        run: python scripts/cge_v9_espn_d1_2026.py
      - name: Publish audit data and scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v9-audit
          if ! git diff --cached --quiet; then
            git commit -m "CGE V9: publish auditable D1 2026 Elo proposals"
            git pull --rebase origin main
            git push origin main
          fi