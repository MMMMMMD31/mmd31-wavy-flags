name: CGE V11 Slim Ratings TSV
on:
  push:
    paths:
      - ".github/workflows/cge_v11_tsv.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/cge_v11_export_tsv.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v11-source-audit/uefa_ratings_slim.tsv
          if ! git diff --cached --quiet; then
            git commit -m "CGE V11: publish slim UEFA Elo records for source-matching"
            git pull --rebase origin main
            git push origin main
          fi
