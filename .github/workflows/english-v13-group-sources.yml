name: MMD31 English V13 verify missing Step 5 stats
on:
  push:
    paths:
      - tools/english_v13_group_sources.py
      - .github/workflows/english-v13-group-sources.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/english_v13_group_sources.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/english-v13/missing_group_tables.json
          git diff --cached --quiet || (git commit -m "Save 2026-27 league standings evidence for missing English clubs" && git push origin HEAD)
