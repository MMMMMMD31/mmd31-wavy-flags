name: CGE V7 Wikipedia club logos
on:
  push:
    paths:
      - 'tools/cge_v7_wiki_article_badges.py'
      - '.github/workflows/cge-v7-wiki-articles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pillow cairosvg requests
      - name: Verify logos linked from national-language football club Wikipedia articles
        run: python -u tools/cge_v7_wiki_article_badges.py
      - name: Publish verified images and audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v7-d3-2026-27/v4/
          if ! git diff --cached --quiet; then
            git commit -m "Publish sourced Wikipedia football crests and audit"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
