name: MMD31 Ligue1 club flag test build
on:
  push:
    branches:
      - mmd31-ligue1-2627-test-20261020
    paths:
      - 'docs/club-flags/ligue1-2627/build.py'
      - 'docs/club-flags/ligue1-2627/sources.json'
      - '.github/workflows/mmd31-ligue1-flags.yml'
jobs:
  flags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Render 18 club flags in both formats
        run: python docs/club-flags/ligue1-2627/build.py
      - name: Commit generated PNG assets on test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/club-flags/ligue1-2627/standard/*.png docs/club-flags/ligue1-2627/victory/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate Ligue 1 2026-27 MMD31 120x96 PNG flags"
            git push
          fi
