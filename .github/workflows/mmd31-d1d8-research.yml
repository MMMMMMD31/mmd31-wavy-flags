name: MMD31 research departmental D1-D8 and D1 2026-27
on:
  push:
    branches:
      - mmd31-d1-d8-pyramide-recherche-20261022
    paths:
      - 'tools/mmd31_collect_d1_d8_and_d1_rosters.py'
      - '.github/workflows/mmd31-d1d8-research.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect true district structure and D1 participants
        run: python tools/mmd31_collect_d1_d8_and_d1_rosters.py
      - name: Store technical research as downloadable artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmd31-district-d1-d8-roster-research
          path: district-research/
          if-no-files-found: warn
