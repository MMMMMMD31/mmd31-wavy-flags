name: MMD31 Ligue 2 Elo reference snapshot
on:
  push:
    branches:
      - mmd31-french-l2l3-2627-20261021
    paths:
      - 'docs/club-flags/french-2627-l2l3/fetch_l2_elo.py'
      - '.github/workflows/mmd31-l2-elo.yml'
jobs:
  ratings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4
      - run: python docs/club-flags/french-2627-l2l3/fetch_l2_elo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/club-flags/french-2627-l2l3/ligue2-elo-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Ligue 2 Elo references"
            git pull --rebase origin mmd31-french-l2l3-2627-20261021
            git push
          fi
