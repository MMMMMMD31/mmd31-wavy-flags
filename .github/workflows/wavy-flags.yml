name: Generate and publish wavy flags
on:
  push:
    branches: [main]
    paths:
      - 'flags_manifest.zlib.b64'
      - 'generate_flags.py'
      - 'generate_emoji_flags.py'
      - '.github/workflows/wavy-flags.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pillow>=10.4,<13' 'requests>=2.32,<3' 'cairosvg>=2.7,<3'
      - run: python generate_emoji_flags.py
      - name: Commit PNG and gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || (git commit -m "Generate regional wavy flag PNGs" && git push)
