name: German club badges 2026-27 (MMD31)
on:
  push:
    branches:
      - mmd31-germany-standard-crests-20261023
    paths:
      - 'tools/german_clubs_2026_27_sources.json'
      - 'tools/generate_german_clubs_2026_27.py'
      - '.github/workflows/mmd31-german-clubs-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests
      - name: Render all 147 real source-based German club crests
        run: python tools/generate_german_clubs_2026_27.py
      - name: Commit Germany-only PNG files to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/v1/
          if git diff --cached --quiet; then
            echo "No new assets"
          else
            git commit -m "Publish 147 German 120x96 real club crest assets"
            git pull --rebase origin mmd31-germany-standard-crests-20261023
            git push origin HEAD:mmd31-germany-standard-crests-20261023
          fi
