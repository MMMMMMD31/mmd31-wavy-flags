name: MMD31 - Quarantine generic and ambiguous crests
on:
  push:
    branches: [mmd31-outremer-ecussons-20261023]
    paths:
      - 'scripts/outremer/quarantine_false_crests.py'
      - '.github/workflows/mmd31-quarantine-false-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/outremer/quarantine_false_crests.py
      - name: Keep suspect artwork only in audit quarantine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A flags/clubs/standard/outremer-2026-27 audit/outremer-2026-27/quarantine audit/outremer-2026-27/quarantine_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Quarantine non-club FFF placeholders and ambiguous duplicate crests"
            git pull --rebase
            git push
          fi
