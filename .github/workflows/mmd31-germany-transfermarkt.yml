name: Verified German club emblems - Transfermarkt profiles

on:
  push:
    branches:
      - mmd31-germany-tm-final-56-20261024
    paths:
      - tools/mmd31_transfermarkt_germany_badges.py
      - tools/mmd31_germany_tm_verified_55.csv
      - .github/workflows/mmd31-germany-transfermarkt.yml

permissions:
  contents: write

jobs:
  authentic-club-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests
      - name: Retrieve exact-profile emblems and render club flags
        run: python tools/mmd31_transfermarkt_germany_badges.py
      - name: Publish verified images and sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/transfermarkt-verified-20261024
          if ! git diff --cached --quiet; then
            git commit -m "Add verified German Transfermarkt crest images"
            git push origin HEAD:mmd31-germany-tm-final-56-20261024
          fi
