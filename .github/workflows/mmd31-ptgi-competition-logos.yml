name: MMD31 PT GIB association competition logos
on:
  push:
    branches: [mmd31-ptgi-logos-20261023-test]
    paths:
      - 'tools/generate_portugal_gibraltar_competition_logos.py'
      - '.github/workflows/mmd31-ptgi-competition-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests pillow cairosvg
      - run: python tools/generate_portugal_gibraltar_competition_logos.py
      - name: Publish new brand assets only to the isolated test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portugal-gibraltar-clubs-2026-27/competition-logos/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified PT and Gibraltar association logo PNGs"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
