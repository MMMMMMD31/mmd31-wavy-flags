name: CGE V15 four D1 authentic crests and federation emblems
on:
  push:
    branches: [mmd31-cge-v15-four-d1-20261024-test]
    paths:
      - '.github/workflows/mmd31-cge-v15-four-d1.yml'
      - 'tools/cge-v15-d1-manifest.json'
      - 'tools/generate_cge_v15_four_d1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow cairosvg
      - run: python tools/generate_cge_v15_four_d1.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v15-four-d1-20261024
          if ! git diff --cached --quiet; then
            git commit -m "Publish real D1 badges and federation emblem files"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
