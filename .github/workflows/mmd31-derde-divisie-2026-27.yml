name: MMD31 Derde Divisie Crest Flags 2026-27
on:
  push:
    paths:
      - 'tools/mmd31_generate_derde_2026_27.py'
      - '.github/workflows/mmd31-derde-divisie-2026-27.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow cairosvg requests beautifulsoup4
      - name: Generate authentic club badge flags 120x96
        run: python tools/mmd31_generate_derde_2026_27.py
      - name: Commit generated assets to isolated test branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nl-derde-divisie-2026-27/v1/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Dutch Derde Divisie club crest flags"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
