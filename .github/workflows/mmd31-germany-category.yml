name: German crest Commons category batch
on:
  push:
    branches: [mmd31-germany-remaining-crests-20261024]
    paths:
      - '.github/workflows/mmd31-germany-category.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-category:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow cairosvg requests
      - name: Match authentic logos in German football Commons categories
        run: python tools/mmd31_commons_category_germany.py
      - name: Commit matched images in separate directory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/german-clubs-2026-27/commons-category-20261024/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Commons category-matched German club crests"
            git pull --rebase origin mmd31-germany-remaining-crests-20261024
            git push origin HEAD:mmd31-germany-remaining-crests-20261024
          fi
