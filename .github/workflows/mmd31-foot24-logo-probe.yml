name: MMD31 Foot24 logo HTML source probe
on:
  push:
    branches: [mmd31-belux-d4-d5-v17-crests-fast]
    paths:
      - 'tools/mmd31-foot24-logo-probe.py'
      - '.github/workflows/mmd31-foot24-logo-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests beautifulsoup4
      - run: python tools/mmd31-foot24-logo-probe.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/belgian-d4-d5-2026-27/v17/foot24_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Probe Foot24 Belgian club crest HTML references"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
