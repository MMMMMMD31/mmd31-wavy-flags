name: CGE V9 ESPN standings test
on:
  push:
    paths:
      - ".github/workflows/cge_v9_espn_test.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests
      - run: python scripts/cge_v9_espn_test.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cge-v9-audit/espn_test.json
          if ! git diff --cached --quiet; then git commit -m "CGE V9: ESPN data availability test"; git pull --rebase origin main; git push origin main; fi