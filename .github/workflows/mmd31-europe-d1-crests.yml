name: Publish European 2026-27 top division club crests
on:
  push:
    paths:
      - 'tools/mmd31_europe_d1_crests.py'
      - '.github/workflows/mmd31-europe-d1-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: python tools/mmd31_europe_d1_crests.py
      - name: Save manifest for transfer
        uses: actions/upload-artifact@v4
        with:
          name: mmd31-europe-d1-manifest
          path: docs/europe-d1-2026-27/v1/manifest.json
      - name: Publish logo inventory and files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/europe-d1-2026-27/v1
          if ! git diff --cached --quiet; then
            git commit -m "Publish sourced 2026/27 Macedonia Bulgaria Romania D1 club badge manifests"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
