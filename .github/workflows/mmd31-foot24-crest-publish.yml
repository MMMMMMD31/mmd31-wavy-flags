name: MMD31 source-checked Foot24 Belgian D4 D5 flags
on:
  push:
    branches: [mmd31-belux-d4-d5-v17-crests-fast]
    paths:
      - 'tools/mmd31-foot24-crest-publish.py'
      - '.github/workflows/mmd31-foot24-crest-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests pillow beautifulsoup4 rapidfuzz
      - run: python tools/mmd31-foot24-crest-publish.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/belgian-d4-d5-2026-27/v17/
          if ! git diff --cached --quiet; then
            git commit -m "Publish exact-team-match sourced 2026-27 Belgian amateur emblems"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
