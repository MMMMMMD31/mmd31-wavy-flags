name: MMD31 four D1 crest provenance 2026
on:
  push:
    branches: [mmd31-cge-greece-cyprus-malta-israel-20261024]
    paths:
      - 'tools/cge_four_leagues_crests_2026.py'
      - '.github/workflows/mmd31-cge-four-d1-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow cairosvg
      - run: python tools/cge_four_leagues_crests_2026.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cge-four-first-divisions-2026-27-crests.json docs/cge-four-first-divisions-2026-27
          if ! git diff --cached --quiet; then
            git commit -m "Publish real-source crest candidates Greece Cyprus Malta Israel"
            git pull --rebase origin mmd31-cge-greece-cyprus-malta-israel-20261024
            git push origin HEAD:mmd31-cge-greece-cyprus-malta-israel-20261024
          fi
