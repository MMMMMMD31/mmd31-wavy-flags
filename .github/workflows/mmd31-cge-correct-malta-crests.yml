name: MMD31 correct Malta 2026 club crests
on:
  push:
    branches: [mmd31-cge-greece-cyprus-malta-israel-20261024]
    paths:
      - 'tools/cge_four_repair_malta_crests.py'
      - '.github/workflows/mmd31-cge-correct-malta-crests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow cairosvg
      - run: python tools/cge_four_repair_malta_crests.py
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cge-four-first-divisions-2026-27-crests.json docs/cge-four-first-divisions-2026-27/
          git commit -m "Replace two incorrect crests with official 2026 club emblems"
          git push origin HEAD:mmd31-cge-greece-cyprus-malta-israel-20261024
